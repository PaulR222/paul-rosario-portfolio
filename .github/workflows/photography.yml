name: Photography validation

on:
  pull_request:
    paths:
      - "app/photography/**"
      - "public/photography/**"
      - "src/data/photos.json"
      - "src/types/photo.ts"
      - "scripts/*photos.mjs"
      - ".github/workflows/photography.yml"
  push:
    paths:
      - "app/photography/**"
      - "public/photography/**"
      - "src/data/photos.json"
      - "src/types/photo.ts"
      - "scripts/*photos.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm photos:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
